name: Generate GeoIP data

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: geoip-daily-release
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - name: Restore last-known-good source files
        id: source-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/geoip/cache
          key: geoip-sources-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            geoip-sources-${{ runner.os }}-
      - name: Install pinned sing-box compiler
        env:
          GOBIN: ${{ runner.temp }}/geoip-bin
        run: go install github.com/sagernet/sing-box/cmd/sing-box@v1.14.0
      - name: Generate databases and reports
        id: generation
        env:
          SING_BOX_BIN: ${{ runner.temp }}/geoip-bin/sing-box
        run: go run ./cmd/geoipgen -config config/sources.json -work-dir .cache/geoip -output-dir dist
      - name: Save source cache
        if: always() && hashFiles('.cache/geoip/cache/**') != ''
        uses: actions/cache/save@v4
        with:
          path: .cache/geoip/cache
          key: geoip-sources-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish dated release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="geoip-$(date -u +%Y%m%d)"
          assets=(
            dist/geoip.dat
            dist/country.mmdb
            dist/country-csv.zip
            dist/source-csv.zip
            dist/sing-box-rulesets.zip
            dist/run-summary.json
            dist/manifest.json
            dist/SHA256SUMS
          )
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "${assets[@]}" --title "$tag" --notes "Daily country GeoIP generation. See run-summary.json and SHA256SUMS for source status and integrity hashes." --repo "$GITHUB_REPOSITORY"
          fi
      - name: Commit refreshed README statistics
        if: always()
        shell: bash
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: refresh GeoIP source statistics"
          git push origin HEAD:main
